name: XCStats Course Records Research

on:
  push:
    branches: [course-records]
    paths:
      - 'scripts/build_course_records.py'
      - 'data/course-records.json'
      - 'components/course-records.tsx'
      - 'components/course-records.module.css'
      - 'app/[slug]/page.tsx'
      - 'lib/content.ts'
      - '.github/workflows/xcstats-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/build_course_records.py
      - name: Commit generated records on latest branch
        run: |
          git config user.name "BellXC Records Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/course-records.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate verified XCStats course records"
            git pull --rebase origin course-records
            git push origin HEAD:course-records
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
