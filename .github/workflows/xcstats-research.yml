name: XCStats Course Records Research

on:
  push:
    branches: [course-records]
    paths:
      - 'scripts/xcstats_probe.py'
      - '.github/workflows/xcstats-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/xcstats_probe.py
