name: XCStats Course Records Research

on:
  push:
    branches: [course-records]
    paths:
      - 'scripts/build_course_records.py'
      - '.github/workflows/xcstats-research.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/build_course_records.py
      - name: Commit generated records
        run: |
          git config user.name "BellXC Records Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/course-records.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate verified XCStats course records"
            git push
          fi
