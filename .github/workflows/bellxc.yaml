name: Deploy Bellarmine XC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Scoring 101 PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path("data/xc-scoring-101-pdf").glob("part-*.b64"))
          encoded = "".join(part.read_text().strip() for part in parts)
          pdf = base64.b64decode(encoded, validate=True)
          expected_sha256 = "cf7faec2b7b1ceffa08ac927fe9fd018e29b8c0fdbd77089d14dc23b0f61da8e"
          actual_sha256 = hashlib.sha256(pdf).hexdigest()
          if len(pdf) != 30822 or actual_sha256 != expected_sha256:
              raise SystemExit(f"Scoring PDF validation failed: size={len(pdf)} sha256={actual_sha256}")
          target = Path("public/docs/xc-scoring-101.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(pdf)
          print(f"Restored {target} ({len(pdf)} bytes, sha256={actual_sha256})")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
