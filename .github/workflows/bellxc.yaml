name: Deploy Bellarmine XC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Scoring 101 PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          expected_parts = {
              "part-01.b64": (6000, "110200ccb0c077208b5fca6d8d4b2f2fd4d1274cfd7e504f2be9df023d080f01"),
              "part-02.b64": (6000, "40233919e3f8a82210acbd5ce1a6c31181c9e84b2e017f352f046dfc94182b31"),
              "part-03.b64": (6000, "97753f729043c4a4c2cdb1446988e9fa5c59afbffdd2b4b67e2e2bcef9552e6d"),
              "part-04.b64": (6000, "8b01123e34ad887a620e813583a21d2b72a49efdc2ea3f2dd28243c081a3d5bb"),
              "part-05.b64": (6000, "a2cb108ad399999ab10e13dcb3bc9d7441279478181e0be5f313e0ae8076b7c8"),
              "part-06.b64": (6000, "1d5ca52e03d56fb2fbd7ed345fa638db12cdb907492fdc7c3a09ed1e83c533d3"),
              "part-07.b64": (5096, "632ab14abb09cf40810fcadaee95eb93cbd902bb7b1238cbdf8d3f16e9087695"),
          }
          parts = sorted(Path("data/xc-scoring-101-pdf").glob("part-*.b64"))
          bad = []
          texts = []
          for part in parts:
              text = part.read_text().strip()
              digest = hashlib.sha256(text.encode()).hexdigest()
              print(f"{part.name}: len={len(text)} sha256={digest}")
              if expected_parts.get(part.name) != (len(text), digest):
                  bad.append(part.name)
              texts.append(text)
          if bad:
              raise SystemExit(f"Scoring PDF source chunks do not match: {', '.join(bad)}")
          encoded = "".join(texts)
          pdf = base64.b64decode(encoded, validate=True)
          expected_sha256 = "cf7faec2b7b1ceffa08ac927fe9fd018e29b8c0fdbd77089d14dc23b0f61da8e"
          actual_sha256 = hashlib.sha256(pdf).hexdigest()
          if len(pdf) != 30822 or actual_sha256 != expected_sha256:
              raise SystemExit(f"Scoring PDF validation failed: size={len(pdf)} sha256={actual_sha256}")
          target = Path("public/docs/xc-scoring-101.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(pdf)
          print(f"Restored {target} ({len(pdf)} bytes, sha256={actual_sha256})")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Type-check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
