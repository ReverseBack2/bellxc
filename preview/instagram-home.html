<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bellarmine XC Instagram Reels Sidebar Preview</title>
<style>
:root{--bell-navy:#1d3d6e;--bell-blue:#2f5f98;--muted:#676767}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#191919;background:#fff}a{color:inherit;text-decoration:none}
.preview-banner{padding:10px 20px;background:#f5d45a;color:#111;text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.site-header{height:124px;padding:15px clamp(24px,4vw,68px);display:flex;align-items:center;justify-content:space-between;gap:42px;background:#fff}.brand{font-family:Georgia,serif;font-size:25px;font-weight:800;color:var(--bell-navy)}.nav{display:flex;gap:28px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.home-grid{display:grid;grid-template-columns:minmax(0,72%) minmax(320px,28%);min-height:calc(100vh - 154px)}.main{min-width:0}.ig-column{min-width:0;min-height:calc(100vh - 154px);padding:clamp(22px,2.5vw,38px);background:var(--bell-navy);color:#fff;overflow:auto}.ig-column .eyebrow{color:#9cc7e8}.ig-column h2{margin:0;font:700 clamp(28px,3vw,46px)/.96 Georgia,serif;letter-spacing:-.045em}.ig-link{margin:14px 0 22px;display:inline-block;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.6);font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.widget-wrap{min-height:520px;overflow:hidden;background:#fff}
.hero{min-height:calc(100vh - 154px);position:relative;display:flex;align-items:center;overflow:hidden;color:#fff;background:url('https://raw.githubusercontent.com/ReverseBack2/bellxc/main/public/images/runner.png') center/cover no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.67),rgba(0,0,0,.13) 65%,rgba(0,0,0,.28))}.hero-copy{position:relative;z-index:1;padding:7vw clamp(28px,8vw,120px)}.eyebrow{margin:0 0 18px;font-size:11px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}.hero h1{margin:0;font-family:Georgia,serif;font-size:clamp(68px,10vw,150px);line-height:.75;letter-spacing:-.07em}.hero p{font-size:18px}.button{display:inline-block;margin-top:12px;padding:15px 20px;background:var(--bell-blue);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:980px){.home-grid{grid-template-columns:1fr}.ig-column{min-height:0}.nav{display:none}.hero{min-height:68vh}}
</style>
</head>
<body>
<div class="preview-banner">Temporary Instagram Reels preview — live homepage is unchanged</div>
<header class="site-header"><div class="brand">BELLARMINE XC</div><nav class="nav"><span>About</span><span>Calendar</span><span>Meet Info</span><span>Records</span><span>Photos</span></nav></header>
<div class="home-grid">
  <main class="main">
    <section class="hero"><div class="hero-copy"><p class="eyebrow">Bellarmine College Preparatory</p><h1>It’s out<br>there.</h1><p>Find your line. Run as one.</p><span class="button">Meet the team →</span></div></section>
  </main>
  <aside class="ig-column">
    <p class="eyebrow">Follow the Bells</p>
    <h2>@bellarminexctf</h2>
    <a class="ig-link" href="https://www.instagram.com/bellarminexctf/" target="_blank">Open Instagram ↗</a>
    <div class="widget-wrap"><div class="sk-ww-instagram-reels" data-embed-id="25708579"></div></div>
  </aside>
</div>
<script src="https://widgets.sociablekit.com/instagram-reels/widget.js" defer></script>
</body>
</html>
