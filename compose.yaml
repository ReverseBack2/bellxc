services:
  bellxc:
    build: .
    container_name: bellxc
    restart: unless-stopped
    ports:
      - "${BELLXC_BIND:-0.0.0.0}:${BELLXC_PORT:-32001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
