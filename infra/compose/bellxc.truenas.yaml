# Install once using Apps > Discover Apps > Install via YAML.
services:
  bellxc:
    image: ghcr.io/reverseback2/bellxc:main
    pull_policy: always
    restart: unless-stopped
    ports:
      - "32001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
